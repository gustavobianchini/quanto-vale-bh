name: Atualizar notícias

on:
  schedule:
    - cron: "23 10 * * *"   # todo dia, 07:23 em Brasília
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: true

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # o site lê dados/noticias.json direto do repositório; não precisa reconstruir o site
      - run: python pipeline/baixar.py noticias dados/noticias.json
      - name: Registrar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/noticias.json
          git diff --cached --quiet || (git commit -m "Notícias $(date +%F) [skip ci]" && git pull --rebase && git push)
