name: Explorar bases (temporário)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Baixar e resumir
        run: |
          mkdir -p dados/explorar
          python -c "import sys; sys.path.insert(0,'pipeline'); import baixar; baixar.alvaras('/tmp/alv')"
          python - <<'PY'
          import glob, pandas as pd
          f = glob.glob('/tmp/alv/*.csv')[0]
          d = pd.read_csv(f, sep=';', dtype=str)
          d = d[d.TIPO.eq('LICENCIAMENTO') & d.USO_GERAL.isin(['RESIDENCIAL', 'MISTO'])]
          d['XY'] = d.GEOMETRIA.str.extract(r'\(\(\(([\d.]+ [\d.]+)')[0]
          d.drop(columns=['GEOMETRIA']).to_csv('dados/explorar/alvaras_res.csv.gz', index=False, sep=';', compression='gzip')
          print(d.shape)
          PY
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add dados/explorar && git commit -m "Exploração de bases [skip ci]" && git push
